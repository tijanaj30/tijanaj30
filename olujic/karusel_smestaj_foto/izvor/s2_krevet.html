<!doctype html><html lang="sr"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="pf_fonts.css">
<style>
:root{--tealD:#0F8F7E;--teal:#2FCFB8;--lilacD:#6E54A8;--ink:#1C2633;--body:#2B3644}
*{margin:0;padding:0;box-sizing:border-box}body{background:#888}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:url(foto_krevet.jpg) 30% 100%/1150px auto no-repeat}
.s::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%)}
.brand{position:absolute;left:80px;top:72px;display:flex;align-items:center;gap:16px;font-family:Jost;font-weight:500;font-size:22px;letter-spacing:.34em;text-transform:uppercase;color:var(--tealD)}
.brand img{height:54px}
.blk{position:absolute;left:80px;top:170px;width:920px}
.u{font-family:PF;font-weight:400;color:var(--ink);line-height:1.04;letter-spacing:-.01em}
.i{font-family:PF;font-weight:400;font-style:italic;color:var(--tealD);line-height:1.04;letter-spacing:-.01em}
.r{width:130px;height:2.5px;background:var(--teal);margin:34px 0 30px;border-radius:2px}
.s2{font-family:PF;font-weight:400;color:var(--body);line-height:1.14}
.s2 i{color:var(--lilacD)}
</style></head><body>
<div class="s" id="s1">
  <div class="brand"><img src="logo_zub.png">Smeštaj</div>
  <div class="blk" style="top:150px">
    <div class="u" style="font-size:72px;line-height:1.1">Za vas smo organizovali<br>smeštaj</div>
    <div class="i" style="font-size:86px;line-height:1.04;margin-top:6px">u samom centru<br>Beograda.<svg width="62" height="78" viewBox="0 0 62 78" style="display:inline-block;vertical-align:-6px;margin-left:18px"><path d="M31 75 C31 75 4 46 4 28 A27 27 0 0 1 58 28 C58 46 31 75 31 75Z" fill="#E3FBF7" stroke="#0F8F7E" stroke-width="3"/><circle cx="31" cy="28" r="10" fill="none" stroke="#0F8F7E" stroke-width="3"/><circle cx="31" cy="28" r="3.5" fill="#6E54A8"/></svg></div>
  </div>
  <div class="blk" style="top:545px;left:auto;right:80px;width:460px;text-align:right">
    <div class="r" style="margin:0 0 26px auto"></div>
    <div class="u" style="font-size:72px;line-height:1.1">Spavate</div>
    <div class="i" style="font-size:66px;line-height:1.08;color:var(--lilacD)">na istom spratu<br>gde je i<br>ordinacija.</div>
  </div>
</div></body></html>
